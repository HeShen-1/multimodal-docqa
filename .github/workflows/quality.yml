name: quality

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend CI dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-ci.txt

      - name: Compile backend
        run: python -m compileall app

      - name: Run backend unit smoke tests
        run: pytest -q tests/unit/test_config.py tests/unit/test_document_processor.py tests/unit/test_ollama_client.py tests/unit/test_document_route_service.py tests/unit/test_permission_service.py tests/unit/test_share_routes.py tests/unit/test_share_service.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
