[pytest]
# Pytest 配置文件

# 过滤警告
filterwarnings =
    # 忽略第三方库的弃用警告
    ignore::DeprecationWarning:paddle.*
    ignore::DeprecationWarning:paddleocr.*
    ignore::DeprecationWarning:jupyter_client.*
    ignore::DeprecationWarning:pytest_asyncio.*
    # 忽略 imghdr 弃用警告（Python 3.13 将移除）
    ignore:'imghdr' is deprecated.*:DeprecationWarning
    # 忽略 Pydantic V2 的弃用警告（这些是框架内部的，我们无法控制）
    ignore:Support for class-based.*:DeprecationWarning:pydantic.*
    ignore:.*json_encoders.*:DeprecationWarning:pydantic.*
    # 忽略事件循环关闭警告
    ignore::RuntimeWarning:_pytest.stash
    ignore:Event loop is closed:RuntimeWarning
    # 忽略 SQLAlchemy 连接池清理警告（测试结束时的正常清理）
    ignore:The garbage collector is trying to clean up.*:sqlalchemy.exc.SAWarning
    ignore::sqlalchemy.exc.SAWarning

# 测试路径
testpaths = tests

# 异步测试配置
asyncio_mode = auto

# 日志配置 - 过滤 SQLAlchemy 连接终止异常
log_cli = false
log_cli_level = ERROR

